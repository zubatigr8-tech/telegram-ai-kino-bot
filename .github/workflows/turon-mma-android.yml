name: Turon MMA — Android APK

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/turon-mma-android.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot keshi
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Godot va eksport shablonlarini yuklab olish
        if: steps.godot-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p ~/godot-cache
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-cache/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android_*' 'templates/version.txt'
          mv templates ~/godot-cache/templates

      # Debug kalit keshda saqlanadi, shunda yangi APK eskisining ustiga o'rnatiladi.
      - name: Debug imzo kaliti
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/keystore
          key: turon-mma-debug-keystore-v1

      - name: Debug kalit yaratish
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/keystore
          keytool -genkeypair -keystore ~/keystore/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Godot sozlamalari
        run: |
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl" ~/.config/godot
          cp ~/godot-cache/templates/* "$tpl/"
          for f in editor_settings-${GODOT_VERSION}.tres editor_settings-4.tres; do
            cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
          done

      - name: Resurslarni import qilish
        run: ~/godot-cache/godot --headless --path . --import

      - name: Avtomatik jang sinovi (bot vs bot)
        run: |
          ~/godot-cache/godot --headless --path . --fixed-fps 60 -s res://tests/sim_test.gd 2>&1 \
            | grep -v -e 'Parameter "m" is null' -e 'mesh_get_surface_count' | tee sim.log
          grep -q '^OK ' sim.log
          if grep -q 'SCRIPT ERROR' sim.log; then exit 1; fi

      - name: APK eksport
        run: |
          mkdir -p build
          ~/godot-cache/godot --headless --path . --export-debug "Android" build/turon-mma.apk
          test -s build/turon-mma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: turon-mma-apk
          path: game/build/turon-mma.apk
